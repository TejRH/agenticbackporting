name: Verify backport
on:
  pull_request:
    branches:
      - 'release-**'
  workflow_dispatch:
jobs:
  verify:
    name: Exploit must fail against the patched component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: node scripts/ci-verify.js
